services:
  - type: web
    name: neire-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
